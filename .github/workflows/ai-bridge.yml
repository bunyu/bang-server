# Builds the AI helper image: ghcr.io/<owner>/bang-ai-bridge:latest (and :<commit sha>).
name: ai-bridge

on:
  push:
    branches: [railway]
    paths: ['ai-bridge/**', '.github/workflows/ai-bridge.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: ai-bridge
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/bang-ai-bridge" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ai-bridge
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
